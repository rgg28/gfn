name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-release-apk
    paths:
      - 'GeForceNowOptimizer-Android-0.1.0.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools

      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          archive="$GITHUB_WORKSPACE/GeForceNowOptimizer-Android-0.1.0.zip"
          if [[ ! -f "$archive" ]]; then
            echo "No se encontró el archivo: $archive"
            exit 1
          fi

          extract_dir="$GITHUB_WORKSPACE/extracted"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

          wrapper="$(find "$extract_dir" -type f -name gradlew -print -quit)"
          if [[ -z "$wrapper" ]]; then
            echo "No se encontró gradlew dentro del ZIP."
            exit 1
          fi

          project_dir="$(dirname "$wrapper")"
          chmod +x "$wrapper"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease

      - name: Collect release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/apk-artifacts"
          mkdir -p "$artifact_dir"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp '{}' "$artifact_dir/" \;

          if ! compgen -G "$artifact_dir/*.apk" > /dev/null; then
            echo "La compilación terminó, pero no se encontró ningún APK release."
            exit 1
          fi

          ls -lh "$artifact_dir"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
