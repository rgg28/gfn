name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-release-apk
    paths:
      - 'GeForceNowOptimizer-Android-0.1.0.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses
          status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project from ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          archive="$GITHUB_WORKSPACE/GeForceNowOptimizer-Android-0.1.0.zip"
          if [[ ! -f "$archive" ]]; then
            echo "No se encontró el ZIP: $archive"
            exit 1
          fi

          extract_dir="$GITHUB_WORKSPACE/extracted"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

          settings_file="$(find "$extract_dir" -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print -quit)"

          if [[ -z "$settings_file" ]]; then
            echo "No se encontró settings.gradle ni settings.gradle.kts dentro del ZIP."
            echo "Contenido extraído:"
            find "$extract_dir" -maxdepth 4 -print | sort
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease

      - name: Collect release APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/apk-artifacts"
          mkdir -p "$artifact_dir"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp '{}' "$artifact_dir/" \;

          if ! compgen -G "$artifact_dir/*.apk" > /dev/null; then
            echo "La compilación terminó, pero no se encontró ningún APK release."
            exit 1
          fi

          ls -lh "$artifact_dir"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
